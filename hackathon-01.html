<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10 text-gray-800 font-sans">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold mb-6 text-indigo-600">Scene Graph Analyzer</h1>
        
        <input type="file" id="imageInput" class="mb-4 block w-full border border-gray-300 rounded p-2" accept="image/*">
        
        <button onclick="analyze()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded transition-colors">
            Analyze Image
        </button>
        
        <div id="results" class="mt-8 hidden">
            <h2 class="text-xl font-bold border-b-2 border-indigo-100 pb-2">1. Detected Objects</h2>
            <ul id="objectsList" class="list-disc pl-6 mt-3 mb-6 text-gray-700 capitalize"></ul>
            
            <h2 class="text-xl font-bold border-b-2 border-indigo-100 pb-2">2. Relationships</h2>
            <p id="description" class="mt-3 text-gray-700 text-lg"></p>
        </div>
    </div>

    <script>
        async function analyze() {
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length === 0) {
                return alert("Please select an image first.");
            }
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file);
            
            // Show loading text
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('objectsList').innerHTML = "<li class='text-gray-400'>Scanning for objects...</li>";
            document.getElementById('description').innerHTML = "<span class='text-gray-400'>Formulating relations...</span>";

            try {
                // Send the image to your Python backend
                const response = await fetch("http://localhost:8000/analyze", {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                
                // Update the Objects List to just point to the description
                const list = document.getElementById('objectsList');
                list.innerHTML = "<li class='text-green-600'>Analysis complete! See below.</li>";
                
                // Update the Relational Description with Gemini's full response
                document.getElementById('description').innerText = data.description;

            } catch (error) {
                alert("Error communicating with server. Check the console for details.");
                console.error(error);
            }
        }
    </script>
</body>
</html>
