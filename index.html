<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #1a73e8;
            margin-bottom: 1.5rem;
        }

        input[type="file"] {
            margin: 1rem 0;
            padding: 10px;
            border: 1px dashed #ccc;
            width: 100%;
            border-radius: 5px;
        }

        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #1557b0;
        }

        .result {
            margin-top: 2rem;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-left: 5px solid #1a73e8;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>AI Image Describer</h1>
        <p>Upload an image to detect objects and their relations.</p>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="image" accept="image/*" required>
            <br>
            <button type="submit">Analyze Image</button>
        </form>

        {% if description %}
        <div class="result">
            <strong>AI Analysis:</strong>
            <p>{{ description }}</p>
        </div>
        {% endif %}
    </div>
</body>

</html>
