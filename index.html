<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Describer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        #uploadArea {
            background: white;
            border: 2px dashed #aaa;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }
        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
        button {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
        #resultBox {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            min-height: 60px;
            color: #333;
            line-height: 1.6;
        }
        #errorText {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>🖼️ Image Describer</h1>

    <div id="uploadArea">
        <input type="file" id="imageInput" accept=".png,.jpg,.jpeg,.gif,.webp">
        <br>
        <img id="imagePreview" alt="Image Preview">
    </div>

    <button id="submitBtn" onclick="uploadImage()" disabled>Get Description</button>

    <p id="errorText"></p>

    <div id="resultBox">
        <p id="resultText">Your image description will appear here...</p>
    </div>

    <script>
        const imageInput = document.getElementById("imageInput");
        const submitBtn = document.getElementById("submitBtn");
        const resultText = document.getElementById("resultText");
        const errorText = document.getElementById("errorText");
        const imagePreview = document.getElementById("imagePreview");

        // Show preview and enable button when a file is selected
        imageInput.addEventListener("change", () => {
            const file = imageInput.files[0];
            errorText.style.display = "none";

            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = "block";
                };
                reader.readAsDataURL(file);
                submitBtn.disabled = false;
            } else {
                imagePreview.style.display = "none";
                submitBtn.disabled = true;
            }
        });

        async function uploadImage() {
            const file = imageInput.files[0];

            if (!file) {
                showError("Please select an image first!");
                return;
            }

            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.innerText = "Analyzing... ⏳";
            resultText.innerText = "Please wait...";
            errorText.style.display = "none";

            const formData = new FormData();
            formData.append("image", file);

            try {
                const response = await fetch("http://127.0.0.1:5000/describe", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || "Something went wrong.");
                    resultText.innerText = "No description available.";
                } else {
                    resultText.innerText = data.description;
                }

            } catch (error) {
                showError("Could not connect to the server. Make sure your backend is running.");
                resultText.innerText = "No description available.";
                console.error(error);
            } finally {
                // Always re-enable the button after request finishes
                submitBtn.disabled = false;
                submitBtn.innerText = "Get Description";
            }
        }

        function showError(message) {
            errorText.innerText = "⚠️ " + message;
            errorText.style.display = "block";
        }
    </script>

</body>
</html>
